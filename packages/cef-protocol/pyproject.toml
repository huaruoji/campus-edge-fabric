[project]
name = "cef-protocol"
version = "0.1.0"
description = "Shared wire protocol, state machine and client SDK for Campus Edge Fabric"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cef_protocol"]
