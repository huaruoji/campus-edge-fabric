[project]
name = "cef-coordinator"
version = "0.1.0"
description = "Campus Edge Fabric coordinator: FastAPI control plane, SQLite queue, lease scheduler, web dashboard"
requires-python = ">=3.11"
dependencies = [
  "cef-protocol",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.2"]

[project.scripts]
cef-coord = "cef_coordinator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cef_coordinator"]

[tool.uv.sources]
cef-protocol = { workspace = true }
