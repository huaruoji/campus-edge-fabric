[project]
name = "cef-worker"
version = "0.1.0"
description = "Campus Edge Fabric worker agent: joins the pool, leases tasks, runs local workloads"
requires-python = ">=3.11"
dependencies = [
  "cef-protocol",
  "httpx>=0.27",
  "psutil>=5.9",
]

[project.optional-dependencies]
thumbnail = ["pillow>=10.3"]
infer = ["pillow>=10.3", "onnxruntime>=1.18", "numpy>=1.26"]
blender = []
all = ["pillow>=10.3", "onnxruntime>=1.18", "numpy>=1.26"]

[project.scripts]
cef-worker = "cef_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cef_worker"]

[tool.uv.sources]
cef-protocol = { workspace = true }
